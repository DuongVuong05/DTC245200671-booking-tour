# Grafana provisioning dashboard provider — tự nạp mọi file JSON trong /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: 'Booking Tour'
    orgId: 1
    folder: 'Booking Tour'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
